name: Unicorn
options:
  bundleIdPrefix: co.omerfarukdemiral
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "976CYYDHW3"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "YES"
targets:
  Unicorn:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.omerfarukdemiral.unicorn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Be Unicorn
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
  UnicornTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Unicorn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.omerfarukdemiral.unicorn.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Unicorn:
    build:
      targets:
        Unicorn: all
        UnicornTests: [test]
    test:
      targets:
        - UnicornTests
    run:
      config: Debug
